<style>
/* Layout: app shell — top bar with tabs, one working panel at a time (RTL) */
:root{
  /* Light blue + silver + matte white. Light theme only, by the owner's choice. */
  --bg:#eceff2; --surface:#f6f7f8; --ink:#1c2833; --muted:#5d6975; --line:#c9d0d7;
  --accent:#2a78b8; --accent-soft:#dcebf7; --brass:#66717c; --brass-soft:#e3e7eb;
  --top:#cfe5f6; --top-ink:#173f63;
  --ok:#1f7a3f; --warn:#a36200; --bad:#b3261e; --info:#2456c7;
  --g1:#e1eefa; --g2:#e9ecef; --g3:#dcf1f5; --g4:#e7e8f4; --sel:#fff0b3;
  --f-body:"Times New Roman",Times,serif;
  --f-display:var(--f-body);
  --f-num:var(--f-body);
  --hl:rgba(255,255,255,.9); --sh:rgba(28,40,51,.18);
  color-scheme:light;
}
/* Themes are chosen per device in settings; all are animated TransMind variants (default: navy). */
:root[data-theme="transmind"]{--bg:#070d18;--surface:rgba(18,30,50,.88);--ink:#e9f0f7;--muted:#9fb3c8;--line:#26405f;--accent:#2f8fe0;--accent-soft:#132c47;--brass:#8fd4ff;--brass-soft:#1a2a3d;
  --top:#0b1626;--top-ink:#dfeaf5;--ok:#4cc27a;--warn:#e0a63a;--bad:#ff6b61;--info:#7aa7ff;--g1:#132a44;--g2:#18243a;--g3:#122f3c;--g4:#1d2340;--sel:#3a3410;
  --hl:rgba(255,255,255,.06);--sh:rgba(0,0,0,.6);color-scheme:dark}
/* TransMind theme: the animated company logo (vector, sharp at any size) sits behind the content. */
:root[data-theme^="transmind"] body{background:#05080f}
:root[data-theme^="transmind"] .tile{background:linear-gradient(160deg,rgba(24,40,64,.55),rgba(8,14,26,.5));-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px)}
:root[data-theme^="transmind"] body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.8;
  background:#05080f url("brand/transmind-logo.svg") center 45%/min(100vw,100vh,760px) no-repeat}
/* Animated colour variants (owner kept navy, turquoise, black, chrome). */
:root[data-theme="transmind-teal"]{--bg:#02090c;--surface:rgba(13,54,64,0.88);--ink:#eef2f6;--muted:#98c5c8;--line:#216768;--accent:#0f8a93;--accent-soft:#114b52;--brass:#a8fff6;--brass-soft:#152e36;--top:#062129;--top-ink:#eef2f6;--ok:#4cc27a;--warn:#e0a63a;--bad:#ff6b61;--info:#7aa7ff;--g1:#10444c;--g2:#062129;--g3:#0a353a;--g4:#0a2b33;--sel:#3a3410;--hl:rgba(255,255,255,.06);--sh:rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme="transmind-teal"] body,:root[data-theme="transmind-teal"] body::after{background-color:#02090c}
:root[data-theme="transmind-teal"] .tile{background:linear-gradient(160deg,rgba(13,54,64,0.55),rgba(2,9,12,0.5))}
:root[data-theme="transmind-teal"] body::after{background-image:url("brand/transmind-teal.svg")}
:root[data-theme="transmind-black"]{--bg:#000000;--surface:rgba(28,28,28,0.88);--ink:#eef2f6;--muted:#bfc5cc;--line:#656a70;--accent:#8a939c;--accent-soft:#343536;--brass:#ffffff;--brass-soft:#1c1c1c;--top:#0d0d0d;--top-ink:#eef2f6;--ok:#4cc27a;--warn:#e0a63a;--bad:#ff6b61;--info:#7aa7ff;--g1:#2c2d2d;--g2:#0d0d0d;--g3:#232324;--g4:#161616;--sel:#3a3410;--hl:rgba(255,255,255,.06);--sh:rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme="transmind-black"] body,:root[data-theme="transmind-black"] body::after{background-color:#000000}
:root[data-theme="transmind-black"] .tile{background:linear-gradient(160deg,rgba(28,28,28,0.55),rgba(0,0,0,0.5))}
:root[data-theme="transmind-black"] body::after{background-image:url("brand/transmind-black.svg")}
:root[data-theme="transmind-chrome"]{--bg:#0a0b0d;--surface:rgba(58,64,72,0.88);--ink:#eef2f6;--muted:#bfc5cc;--line:#70767e;--accent:#979ea5;--accent-soft:#50565d;--brass:#ffffff;--brass-soft:#2c2f33;--top:#1e2226;--top-ink:#eef2f6;--ok:#4cc27a;--warn:#e0a63a;--bad:#ff6b61;--info:#7aa7ff;--g1:#494f56;--g2:#1e2226;--g3:#33373b;--g4:#2e333a;--sel:#3a3410;--hl:rgba(255,255,255,.06);--sh:rgba(0,0,0,.6);color-scheme:dark}
:root[data-theme="transmind-chrome"] body,:root[data-theme="transmind-chrome"] body::after{background-color:#0a0b0d}
:root[data-theme="transmind-chrome"] .tile{background:linear-gradient(160deg,rgba(58,64,72,0.55),rgba(10,11,13,0.5))}
:root[data-theme="transmind-chrome"] body::after{background-image:url("brand/transmind-chrome.svg")}
:root[data-theme="transmind-black"] body::after{opacity:1}
/* Black + silver: a broad silver light sweeps across the whole screen so the motion is obvious. */
:root[data-theme="transmind-black"] main::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(225,232,240,.10) 42%,rgba(255,255,255,.30) 50%,rgba(225,232,240,.10) 58%,transparent 70%) 0 0/300% 100%;animation:tmSweep 5s ease-in-out infinite}
@keyframes tmSweep{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){:root[data-theme="transmind-black"] main::before{animation:none;opacity:0}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--top);color:var(--top-ink);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin-inline:auto}
.brand{font-family:var(--f-display);font-size:20px}
.status{font-size:12px;opacity:.85}
.ic{width:18px;height:18px;fill:url(#gold);vertical-align:-3px;margin-inline-end:6px;filter:drop-shadow(0 1px 0 rgba(90,60,5,.18))}
.ic.coin{width:26px;height:26px;vertical-align:-6px;margin-inline-end:4px}
.homebtn{background:var(--surface);color:var(--top-ink);font-weight:600;padding:6px 12px;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-height:130px;padding:16px;text-align:center;
  background:linear-gradient(160deg,var(--surface),var(--bg));border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600;
  box-shadow:-4px -4px 10px var(--hl),6px 8px 16px var(--sh),inset 0 1px 0 var(--hl);
  transition:transform .12s ease,box-shadow .12s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tile:active,.tile.pressed{transform:translateY(2px) scale(.97);
  box-shadow:inset 4px 4px 9px var(--sh),inset -4px -4px 9px var(--hl)}
.tile .ic{width:48px;height:48px;margin:0;transition:transform .12s ease;
  filter:drop-shadow(0 -1px 0 rgba(255,240,200,.7)) drop-shadow(0 1.5px 0 #6b4a12) drop-shadow(0 3px 0 #59400f) drop-shadow(2px 7px 6px rgba(0,0,0,.35));
  -webkit-box-reflect:below 4px linear-gradient(transparent 55%,rgba(255,255,255,.28))}
.ic .gloss{fill:url(#gloss)}
.tile:active .ic,.tile.pressed .ic{transform:translateY(1px) scale(.94);filter:drop-shadow(0 1px 0 rgba(255,255,255,.6)) drop-shadow(0 1px 1px rgba(80,55,10,.3))}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:start;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:100%}
.pname{font-weight:600;font-size:16px}
.pusd{font-size:20px;font-weight:700} .pusd small{font-size:12px;font-weight:500}
main{max-width:1200px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3}
h1{font-size:24px} h2{font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;width:100%;box-sizing:border-box}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 100px;gap:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-size:14px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,tr:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.d{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
.okmsg{color:var(--ok);font-size:13px}
.summary{background:var(--accent-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.summary .big{font-weight:700;color:var(--accent);font-size:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:start;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
td.n,th.n{text-align:end;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--bg);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.st tbody tr.c0{background:var(--g1)} .st tbody tr.c1{background:var(--g2)} .st tbody tr.c2{background:var(--g3)} .st tbody tr.c3{background:var(--g4)}
.st tbody tr.sel{background:var(--sel)}
.st tbody tr.gs td{border-top:2px solid var(--surface)}
.st tbody tr{cursor:pointer}
.st tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.gid{font-family:var(--f-num);font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.kind{font-size:11px;font-weight:600;color:var(--brass);background:var(--brass-soft);border-radius:4px;padding:0 6px;margin-inline-end:4px;white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);vertical-align:middle;padding:0;background:transparent}
.dot.ok{border-color:var(--ok);background:var(--ok)} .dot.audit{border-color:var(--info);background:var(--info)} .dot.err{border-color:var(--bad);background:var(--bad)}
.balbox{display:flex;flex-direction:column;gap:2px;background:var(--accent-soft);border-radius:8px;padding:10px 16px;align-items:flex-start}
.balbox strong{font-size:24px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.pill{display:inline-block;font-size:12px;padding:1px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;background:#1f7a3f;color:#fff;border-radius:12px;padding:14px 16px;text-align:center;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
/* Sign-in and lock screens: logo fills the top half, sign-in options in the bottom half, colours taken from the logo. */
body.auth{background:var(--bg);overflow-x:hidden} body.auth .top,body.auth::before{display:none}
body.auth main{max-width:none;padding:0;gap:0}
.auth{min-height:100dvh;display:grid;grid-template-rows:50dvh 1fr;grid-template-columns:minmax(0,1fr);background:radial-gradient(circle at 50% 28%,var(--g1),var(--bg) 70%);color:var(--ink)}
.auth-logo{display:flex;align-items:center;justify-content:center;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.auth-logo img{width:100%;height:100%;object-fit:cover}
.auth-panel{box-sizing:border-box;background:linear-gradient(180deg,var(--surface),var(--bg));border-top:1px solid var(--line);border-radius:24px 24px 0 0;
  padding:24px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;width:100%;max-width:460px;margin-inline:auto}
.auth-panel h1{color:var(--brass);font-size:22px;text-align:center} .auth-panel label,.auth-panel .hint{color:var(--muted)}
.auth-panel input{background:var(--g2);border-color:var(--line);color:var(--ink)}
.auth-panel button{background:var(--accent-soft);border-color:var(--line);color:var(--ink);min-height:46px;font-size:16px}
.auth-panel button.p{background:var(--accent);border-color:var(--accent);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.auth-panel .err{color:#ff8a80}
.banner{background:var(--brass-soft);border-radius:8px;padding:10px 14px;font-size:14px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:18px;max-width:min(460px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.4)}
.check{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.check input{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;background:var(--surface)}
.kpi small{color:var(--muted);font-size:12px} .kpi strong{font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <label>النوع<select id="na_kind"><option value="person">فرد</option><option value="company">شركة</option><option value="branch">فرع</option></select></label>

    <div class="btns"><button type="submit" class="p" id="na_go">إضافة</button><button type="button" id="na_close">رجوع</button></div>
  </form>
</dialog>
<dialog id="cancelDlg">
  <form method="dialog" id="cancelForm" style="display:flex;flex-direction:column;gap:12px">
    <h2 id="cancelTitle">إلغاء العملية</h2>
    <div id="cancelInfo" class="hint"></div>
    <label>سبب الإلغاء<input id="cancelReason" maxlength="200"></label>
    <label class="check" id="refundWrap"><input type="checkbox" id="refundFee"> <span id="refundLbl">إرجاع العمولة</span></label>
    <div class="err" id="cancelErr"></div>
    <div class="btns"><button type="button" class="d" id="cancelGo">تأكيد الإلغاء</button><button type="button" id="cancelClose">رجوع</button></div>
  </form>
</dialog>
</div>

<script>
"use strict";
// ---------- constants ----------
const DEFAULT_SETTINGS = {
  currencies: ["USD","AED","EGP","EUR","SYP"],
  countries: ["الإمارات","مصر","سوريا","لبنان","تركيا","ألمانيا"],
  reasons: ["دفعة ثمن منزل","مصاريف عائلية","تجارة","تسديد دين","رواتب"],
  // 1 USD = x. Cross rates are derived through USD.
  usdRates: {USD:1, AED:3.6725, EGP:48.5, EUR:0.92, SYP:138.5},
  feeMode: "deduct",     // "deduct" (default, owner's rule): fee taken out of the amount sent | "top": fee charged on top to sender
  cutBothLegs: true,     // a cut posts both currencies on the same account
  ratesUpdated: null
};
const CUR_NAMES = {USD:"دولار أمريكي",AED:"درهم إماراتي",EGP:"جنيه مصري",EUR:"يورو",SYP:"ليرة سورية"};
const RECON = ["", "ok", "audit", "err"];
const RECON_LBL = {"":"بدون", ok:"مطابقة نهائية", audit:"تدقيق", err:"خطأ"};
const TYPE_LBL = {transfer:"حوالة", receipt:"استلام دفعة", deposit:"إيداع نقدي", withdraw:"سحب نقدي", cover:"تغطية رصيد", settle:"تسوية", cut:"قطع"};

// ---------- state ----------
let sb = null, me = null, accounts = [], ops = [], settings = structuredClone(DEFAULT_SETTINGS);
let loaded = {acc:false, ops:false, set:false}, readOnly = false;
const ui = {stAcc:"", stCur:"", stFrom:"", stTo:"", stQ:"", stType:"", sel:null, logQ:"", logType:""};
try { Object.assign(ui, JSON.parse(localStorage.getItem("ui")||"{}")); } catch(e) {}
const saveUi = () => { try { localStorage.setItem("ui", JSON.stringify(ui)); } catch(e) {} };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const APP_VERSION = "33"; // keep in step with CACHE in sw.js
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// ponytail: money kept as JS numbers rounded to 2 decimals; upgrade path is integer minor units if amounts exceed ~1e13.
const r2 = x => Math.round((+x + Number.EPSILON) * 100) / 100;
// Owner's rule: every money amount is a whole number rounded to the nearest 5 (no decimals). Rates keep their decimals.
const r5 = x => Math.round((+x || 0) / 5) * 5;
console.assert(r5(36039.4) === 36040 && r5(177) === 175 && r5(178) === 180, "r5");
const fmt = (x, d=0) => (+x).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtBal = x => { const v = r2(x); return v < 0 ? "(" + fmt(-v) + ")" : fmt(v); };
const side = x => r2(x) < 0 ? "عليه" : r2(x) > 0 ? "له" : ""; // per account: عليه = owes us, له = we owe him
// Colour follows the word shown, for every account: له = green, عليه = red.
const sideCls = x => r2(x) > 0 ? "pos" : r2(x) < 0 ? "neg" : "";
const today = () => new Date().toISOString().slice(0,10);
const accName = id => { const a = accounts.find(a => a.id === id); return a ? a.name + " · " + a.country : "حساب محذوف"; };
const rateOf = (from, to) => {
  const u = settings.usdRates || {};
  if (from === to) return 1;
  if (!u[from] || !u[to]) return 0;
  return u[to] / u[from];
};
const fmtRate = x => { if (!x) return ""; const d = x >= 100 ? 2 : x >= 1 ? 4 : 6; return (+x.toFixed(d)).toString(); };
const curOpts = sel => settings.currencies.map(c => `<option value="${esc(c)}"${c===sel?" selected":""}>${esc(c)}</option>`).join("");
const KIND_LBL = {person:"فرد", company:"شركة", branch:"فرع"};
const NEW_ACC = "__new";
const accOpts = (sel, blank="اختر حساباً", canAdd=true) => `<option value="">${blank}</option>` + accounts.slice().sort((a,b)=>a.name.localeCompare(b.name,"ar")).map(a => `<option value="${esc(a.id)}"${a.id===sel?" selected":""}>${esc(a.name)} · ${esc(a.country)}${KIND_LBL[a.kind] ? " · " + KIND_LBL[a.kind] : ""}</option>`).join("")
  + (canAdd && !readOnly ? `<option value="${NEW_ACC}">＋ إضافة حساب جديد…</option>` : "");
// ----- transfer reasons (saved list in settings, "add new" inside the picker) -----
// Same pattern for beneficiaries and delivery places: saved text lists, not ledger accounts.
const LISTS = {
  reasons: {empty:"بدون سبب", add:"إضافة سبب جديد", title:"إضافة سبب تحويل", lbl:"السبب", ph:"مثلاً: قسط سيارة"},
  bens:    {empty:"اختر المستفيد", add:"إضافة مستفيد جديد", title:"إضافة مستفيد", lbl:"اسم المستفيد", ph:"مثلاً: أحمد الخياط"},
  places:  {empty:"اختر مكان التسليم", add:"إضافة مكان جديد", title:"إضافة مكان تسليم", lbl:"مكان التسليم", ph:"مثلاً: الشارقة"},
};
const NEW_ITEM = "__newitem";
const listOpts = (key, sel = "") => `<option value="">${LISTS[key].empty}</option>` + (settings[key] || []).map(r => `<option${r===sel?" selected":""}>${esc(r)}</option>`).join("")
  + (readOnly ? "" : `<option value="${NEW_ITEM}">＋ ${LISTS[key].add}…</option>`);
const listSel = (id, key) => `<select id="${id}" data-list="${key}">${listOpts(key)}</select>`;
const reasonOpts = () => listOpts("reasons");
const withReason = k => { const r = $("#" + k + "_reason").value, n = $("#" + k + "_note").value.trim(); return [r && "السبب: " + r, n].filter(Boolean).join(" · "); };
let reasonTarget = null;
document.addEventListener("change", e => {
  const sel = e.target;
  if (!(sel instanceof HTMLSelectElement) || sel.value !== NEW_ITEM) return;
  e.stopImmediatePropagation(); sel.value = ""; reasonTarget = sel;
  const L = LISTS[sel.dataset.list || "reasons"];
  $("#nr_title").textContent = L.title; $("#nr_lbl").textContent = L.lbl; $("#nr_name").placeholder = L.ph;
  $("#nr_name").value = ""; $("#nr_err").textContent = ""; $("#reasonDlg").showModal(); $("#nr_name").focus();
}, true);

// Any account picker: choosing "add new account" opens the dialog, then selects the new account.
let accTarget = null;
document.addEventListener("change", e => {
  const sel = e.target;
  if (!(sel instanceof HTMLSelectElement) || sel.value !== NEW_ACC) return;
  e.stopImmediatePropagation(); sel.value = ""; accTarget = sel;
  $("#na_name").value = ""; $("#na_err").textContent = "";
  $("#na_country").innerHTML = settings.countries.map(c => `<option>${esc(c)}</option>`).join("");
  $("#accDlg").showModal(); $("#na_name").focus();
}, true);
const nextNo = () => ops.reduce((m,o) => Math.max(m, o.no||0), 1000) + 1; // preview only; the real number comes from the database sequence

// Arabic number to words (integers)
function words(n) {
  n = Math.floor(Math.abs(n));
  if (n === 0) return "صفر";
  const ones = ["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const tens = ["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hund = ["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  const b1000 = x => { const p=[], h=Math.floor(x/100), r=x%100;
    if (h) p.push(hund[h]);
    if (r) p.push(r < 20 ? ones[r] : (r%10 ? ones[r%10] + " و" + tens[Math.floor(r/10)] : tens[Math.floor(r/10)]));
    return p.join(" و"); };
  const scales = [[1e9,"مليار","ملياران","مليارات"],[1e6,"مليون","مليونان","ملايين"],[1e3,"ألف","ألفان","آلاف"]];
  const parts = [];
  for (const [s, one, two, many] of scales) {
    const c = Math.floor(n / s); n %= s;
    if (!c) continue;
    parts.push(c===1 ? one : c===2 ? two : c<=10 ? b1000(c) + " " + many : b1000(c) + " " + one);
  }
  if (n) parts.push(b1000(n));
  return parts.join(" و");
}
console.assert(words(3377) === "ثلاثة آلاف وثلاثمائة وسبعة وسبعون", "words(3377)");
console.assert(words(289452) === "مائتان وتسعة وثمانون ألف وأربعمائة واثنان وخمسون", "words(289452)");

// ---------- USD equivalent, fixed at the time of each operation ----------
// ur = units of the entry currency per 1 USD, saved on the entry so later rate changes never move old balances.
const usdRateOf = c => c === "USD" ? 1 : +((settings.usdRates || {})[c]) || 0;
function pairUsdRates(a, b, rate) { // rate = units of b per 1 unit of a (the operation's own rate)
  if (a === "USD") return {[a]:1, [b]:rate};
  if (b === "USD") return {[a]:1 / rate, [b]:1};
  const ua = usdRateOf(a); return {[a]:ua, [b]:ua * rate};
}
const stampUsd = (entries, rates) => entries.forEach(e => { e.ur = rates[e.cur] || usdRateOf(e.cur); });
const entryUsd = e => { const ur = e.ur || usdRateOf(e.cur); return ur ? ((e.credit||0) - (e.debit||0)) / ur : 0; };
console.assert(Math.abs(entryUsd({cur:"AED", credit:3672.5, ur:3.6725}) - 1000) < 1e-9, "entryUsd");

// ---------- entries / balances ----------
function allEntries() {
  const out = [];
  for (const o of ops) (o.entries||[]).forEach((e, i) => out.push({...e, op:o, idx:i}));
  return out;
}
// A cancelled op whose reversal fully nets out (fee refunded, or no fee) is hidden by default; it changes no balance.
// ponytail: hidden, not deleted (ops delete is revoked in the DB to keep an audit trail). Upgrade: a guarded delete RPC.
const hiddenOp = o => !ui.showCancelled && o.status === "cancelled" && (o.feeRefunded || !o.feeAmt);
const cancelToggle = () => ops.some(o => o.status === "cancelled" && (o.feeRefunded || !o.feeAmt)) ? `<label class="hint" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="showCx" ${ui.showCancelled?"checked":""} style="width:auto"> إظهار العمليات الملغاة</label>` : "";
document.addEventListener("change", e => { if (e.target.id === "showCx") { ui.showCancelled = e.target.checked; saveUi(); route(true); } });
function balances() { // {accId:{cur:balance}} balance = credit(علينا) - debit(لنا)
  const b = {};
  for (const o of ops) for (const e of (o.entries||[])) {
    b[e.acc] ??= {}; b[e.acc][e.cur] = r2((b[e.acc][e.cur]||0) + (e.credit||0) - (e.debit||0));
  }
  return b;
}

// ---------- writes ----------
// ---------- Supabase ----------
// ops are stored as {id, no, data(jsonb)}; jsonb keeps numbers as exact Postgres numeric. Amounts are rounded to cents (r2) before saving.
const unwrap = r => ({id:r.id, no:r.no, ...r.data});
const strip = op => { const {id, no, ...rest} = op; return rest; };
const must = ({data, error}) => { if (error) throw error; return data; };
async function saveOp(op) {
  const row = must(await sb.from("ops").insert({data:strip(op)}).select("id,no").single());
  op.no = row.no; await loadAll(); return row;
}
async function patchOp(op, patch) {
  must(await sb.from("ops").update({data:{...strip(op), ...patch}}).eq("id", op.id));
  await loadAll();
}
// Retries a few times: right after a token refresh the server can briefly reject the new token (seen in logs as 401 PGRST303).
async function loadAll(tries = 3) {
  const sig = AbortSignal.timeout(10000); // a stalled request is retried instead of leaving the app on the loading screen
  const [a, o, st] = await Promise.all([
    sb.from("accounts").select("id,name,country,kind").order("name").abortSignal(sig),
    sb.from("ops").select("id,no,data").order("no").abortSignal(sig),
    sb.from("settings").select("data").maybeSingle().abortSignal(sig)]);
  const bad = [a, o, st].find(r => r.error);
  if (bad) {
    if (tries > 1) { await new Promise(res => setTimeout(res, 1200)); if (bad.error.code === "PGRST303" || bad.status === 401) await sb.auth.refreshSession().catch(() => {}); return loadAll(tries - 1); }
    throw bad.error;
  }
  accounts = a.data; ops = o.data.map(unwrap);
  settings = {...structuredClone(DEFAULT_SETTINGS), ...(st.data?.data || {})};
  if (cancelling) cancelling = ops.find(x => x.id === cancelling.id) || null;
  loaded = {acc:true, ops:true, set:true};
  setStatus("متصل · البيانات محفوظة"); route(true);
}
function setStatus(t) { $("#status").textContent = t ? t + " · الإصدار " + APP_VERSION : ""; }

// Clean typed numbers on leaving a field: "01.8" -> "1.8", "007" -> "7".
document.addEventListener("focusout", e => { const i = e.target; if (i.matches?.("input[inputmode=decimal]") && /^0\d/.test(i.value)) { i.value = i.value.replace(/^0+(?=\d)/, ""); i.dispatchEvent(new Event("input")); } });

// ---------- views ----------
const views = {};
// Forms are not redrawn by live data updates, so typing is never wiped; lists and statements are.
const FORMS = new Set(["transfer","move","cut","rates"]);
let current = null;
function route(fromData) {
  if (!me || (bioId() && !unlocked)) return; // sign-in / lock screens stay put
  document.body.classList.remove("auth");
  const v = (location.hash || "#home").slice(1);
  const name = views[v] ? v : "home";
  $("#homeBtn").hidden = name === "home" || !me;
  if (window.__dbFailed) return;
  if (!(loaded.acc && loaded.ops && loaded.set)) { $("#app").innerHTML = `<div class="empty">جارِ تحميل البيانات…</div>`; return; }
  if (fromData === true && FORMS.has(name) && current === name) return;
  current = name;
  views[name]();
}
// Each screen is its own history entry, numbered by depth, so the phone's back goes exactly one step back.
let navDepth = history.state?.d ?? 0, goingHome = false;
if (history.state?.d === undefined) history.replaceState({d:0, base:1}, "", location.hash || "#home"); // same URL as home, so back to it is not a hash change
// Back on the home screen must not leave the app (that showed the sign-in page, then closed it). The first entry is a
// "base" below home; a guard home entry sits on top of it. Landing on the base puts the guard back and stays on home.
// The guard is (re)added on a tap, because browsers skip history entries added without a user gesture.
const armGuard = () => { if (history.state?.base && me) history.pushState({d:0}, "", "#home"); };
addEventListener("pointerdown", armGuard, true);
window.addEventListener("hashchange", () => {
  if (history.state?.d === undefined) history.replaceState({d: navDepth + 1}, "");
  navDepth = history.state.d;
  if (goingHome && location.hash !== "#home" && location.hash !== "") { goingHome = false; location.replace("#home"); return; }
  goingHome = false; route(false);
});
// Back closes an open dialog instead of leaving the screen.
const _showModal = HTMLDialogElement.prototype.showModal;
HTMLDialogElement.prototype.showModal = function () { _showModal.call(this); history.pushState({d: navDepth, dlg:1}, ""); };
document.addEventListener("close", () => { if (history.state?.dlg) history.back(); }, true);
window.addEventListener("popstate", () => {
  if (!history.state?.dlg) document.querySelectorAll("dialog[open]").forEach(d => d.close());
  if (history.state?.base && me) { navDepth = 0; history.pushState({d:0}, "", "#home"); if (current !== "home") route(false); }
});
const roGuard = () => readOnly ? `<div class="banner">لا يمكن التعديل من هذا الحساب، العرض فقط.</div>` : "";
const needAccounts = () => accounts.length ? "" : `<div class="banner">لا توجد حسابات بعد. <a href="#accounts">أضف أول حساب</a> (مثلاً «دبي، باسم بشار»).</div>`;

// ----- balances -----
views.balances = () => {
  const b = balances(), usd = {};
  for (const o of ops) for (const e of (o.entries||[])) usd[e.acc] = (usd[e.acc]||0) + entryUsd(e);
  const totLah = r5(Object.values(usd).filter(v => v > 0).reduce((x,y) => x + y, 0)), totAlayh = r5(-Object.values(usd).filter(v => v < 0).reduce((x,y) => x + y, 0));
  const list = accounts.slice().sort((x,y)=>x.name.localeCompare(y.name,"ar"));
  const card = a => { const u = r5(usd[a.id]||0), cs = Object.entries(b[a.id]||{}).filter(([,v]) => r2(v));
    return `<button type="button" class="pcard" data-acc="${esc(a.id)}">
      <span class="pname">${esc(a.name)} <small class="hint">${esc(a.country)}</small></span>
      <span class="pusd ${sideCls(u)}"><span class="num">${fmt(Math.abs(u))} USD</span> <small>${side(u) || "متوازن"}</small></span>
      <span class="chips">${cs.map(([c,v]) => `<span class="chip" data-cur="${esc(c)}"><span class="num">${fmtBal(v)} ${esc(c)}</span> ${side(v)}</span>`).join("") || `<span class="hint">${b[a.id] ? "الحساب مسدّد" : "لا توجد حركات"}</span>`}</span>
    </button>`; };
  $("#app").innerHTML = `${needAccounts()}
  <h1>الأرصدة</h1>
  <div class="grid"><div class="balbox"><small class="hint">مجموع «له» بالدولار</small><strong class="num pos">${fmt(totLah)} USD</strong></div>
  <div class="balbox"><small class="hint">مجموع «عليه» بالدولار</small><strong class="num neg">${fmt(totAlayh)} USD</strong></div></div>
  <p class="hint">لكل شخص: الرصيد الموحّد بالدولار، وتحته رصيد كل عملة. «له» = مبلغ مستحق له عندنا، «عليه» = مبلغ مستحق علينا منه، والرقم بين قوسين = عليه. اضغط على العملة لفتح كشفها.</p>
  <div class="plist">${list.map(card).join("")}</div>`;
  document.querySelectorAll(".pcard").forEach(btn => btn.onclick = e => {
    const chip = e.target.closest("[data-cur]");
    ui.stAcc = btn.dataset.acc; ui.stCur = chip ? chip.dataset.cur : ""; ui.sel = null; saveUi(); location.hash = "#statement";
  });
};

// ----- home -----
const SECTIONS = [["balances","bal","الأرصدة"],["transfer","tr","حوالة جديدة"],["move","cash","حركة نقدية"],["cut","ex","قطع / تحويل عملة"],["statement","doc","كشف حساب"],["log","log","سجل العمليات"],["accounts","usr","الحسابات"],["rates","pct","أسعار اليوم والإعدادات"]];
views.home = () => {
  $("#app").innerHTML = `${needAccounts()}<div class="tiles">${SECTIONS.map(([h,i,t]) => `<a class="tile" href="#${h}"><svg class="ic" aria-hidden="true"><use href="#i-${i}"/><use class="gloss" href="#i-${i}"/></svg><span>${t}</span></a>`).join("")}</div>`;
  // Show the pressed-in state for a moment before opening, so a quick tap is visible.
  document.querySelectorAll(".tile").forEach(t => t.onclick = e => { e.preventDefault(); t.classList.add("pressed"); setTimeout(() => { location.hash = t.getAttribute("href"); }, 140); });
};

// ----- new transfer -----
views.transfer = () => {
  $("#app").innerHTML = `${roGuard()}${needAccounts()}
  <h1>حوالة جديدة <span class="num hint">#${nextNo()}</span></h1>
  <form class="card" id="tf" novalidate>
    <div class="grid">
      <label>التاريخ<input type="date" id="t_date" value="${today()}"></label>
      <label>الوسيط (الذي قبض المبلغ)<select id="t_from">${accOpts("")}</select></label>
      <label>دولة المصدر (التي خرجت منها الحوالة)<select id="t_country"><option value="">اختر الدولة</option>${settings.countries.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>
      <label>رصيد الوسيط الحالي<input id="t_bal" readonly tabindex="-1"></label>
    </div>
    <div class="grid">
      <label>المبلغ والعملة<span class="pair"><input id="t_amt" inputmode="numeric" placeholder="0"><select id="t_cur">${curOpts("USD")}</select></span></label>
      <label>عملة التسليم للمستفيد<select id="t_tocur">${curOpts("USD")}</select></label>
      <label><span id="t_ratelbl">سعر الصرف (قابل للتعديل)</span><input id="t_rate" inputmode="decimal"><span class="hint" id="t_ratehint"></span></label>
    </div>
    <div class="grid">
      <label>المستفيد (حساب)<select id="t_ben">${accOpts("")}</select></label>
      <label>مكان التسليم${listSel("t_place","places")}</label>
      <label>نسبة العمولة %<input id="t_fee" inputmode="decimal" placeholder="0"></label>
    </div>
    <label>سبب التحويل<select id="t_reason">${reasonOpts()}</select></label>
    <label>ملاحظات (وصف أو علامة مميزة)<textarea id="t_note" maxlength="300" placeholder="مثلاً: دفعة ثمن منزل، سُلّمت في موناكو"></textarea></label>
    <div class="chips" id="t_quick"></div>
    <div class="summary" id="t_sum"></div>
    <div class="err" id="t_err" role="alert"></div>
    <div class="btns"><button class="p" type="submit" ${readOnly?"disabled":""}>حفظ الحوالة</button><span class="okmsg" id="t_ok"></span></div>
    <p class="hint">طريقة العمولة الحالية: ${settings.feeMode==="top"?"تُضاف إلى المبلغ وتُخصم من المرسل":"تُخصم من المبلغ المرسل فيصل مبلغ أقل"}. يمكن تغييرها من «أسعار اليوم والإعدادات».</p>
  </form>`;
  const f = id => $("#" + id);
  let rateTouched = false;
  // Rates are typed the way exchange desks write them (>= 1, e.g. 3.6725 AED per USD); inv means the typed number is divided.
  const inv = () => rateOf(f("t_cur").value, f("t_tocur").value) < 1;
  const effRate = () => { const v = +f("t_rate").value; return v > 0 ? (inv() ? 1 / v : v) : 0; };
  const quick = [...new Set(ops.map(o => o.note).filter(Boolean))].slice(-8).reverse();
  f("t_quick").innerHTML = quick.map(q => `<button type="button" class="chip">${esc(q)}</button>`).join("");
  f("t_quick").querySelectorAll("button").forEach(b => b.onclick = () => { f("t_note").value = b.textContent; });
  const setRate = () => { const r = rateOf(f("t_cur").value, f("t_tocur").value), a = f("t_cur").value, b = f("t_tocur").value;
    f("t_ratelbl").textContent = a === b ? "سعر الصرف" : inv() ? `السعر: كم ${a} لكل 1 ${b} (قابل للتعديل)` : `السعر: كم ${b} لكل 1 ${a} (قابل للتعديل)`;
    if (!rateTouched) f("t_rate").value = fmtRate(r && r < 1 ? 1 / r : r); calc(); };
  const calc = () => {
    const amt = r5(f("t_amt").value.replace(/,/g,"")), rate = effRate(), fee = +f("t_fee").value, cur = f("t_cur").value, to = f("t_tocur").value;
    const def = rateOf(cur, to), shownDef = def && def < 1 ? 1 / def : def;
    f("t_ratehint").textContent = cur===to ? "نفس العملة" : (shownDef && Math.abs(+f("t_rate").value - +fmtRate(shownDef)) > 1e-9 ? `سعر اليوم ${fmtRate(shownDef)} · عُدّل لهذه الحوالة` : "سعر اليوم");
    const bal = (balances()[f("t_from").value]||{})[cur] || 0;
    f("t_bal").value = f("t_from").value ? fmtBal(bal) + " " + cur + " " + side(bal) : "";
    if (!(amt > 0)) { f("t_sum").innerHTML = `<span>أدخل المبلغ لعرض الحساب</span><span></span>`; return; }
    const c = compute(amt, fee||0, rate||0);
    f("t_sum").innerHTML = `<span>العمولة ${esc(fee||0)}%</span><span class="num">${fmt(c.fee)} ${esc(cur)}</span>
      <span>على الوسيط (عليه) بعد العمولة</span><span class="num big">${fmt(c.sendAmt)} ${esc(cur)}</span>
      <span>للمستفيد (له)</span><span class="num big">${fmt(c.toAmt)} ${esc(to)}</span>
      <span>رصيد الوسيط بعد هذه الحوالة</span><span class="num">${fmt(Math.abs(r2(bal - c.sendAmt)))} ${esc(cur)} ${side(r2(bal - c.sendAmt))}</span>`;
  };
  ["t_amt","t_fee","t_from"].forEach(id => f(id).addEventListener("input", calc));
  f("t_rate").addEventListener("input", () => { rateTouched = true; calc(); });
  f("t_cur").onchange = f("t_tocur").onchange = () => { rateTouched = false; setRate(); };
  f("t_from").addEventListener("change", () => { const a = accounts.find(a => a.id === f("t_from").value); if (a) f("t_country").value = a.country; });
  setRate();
  f("tf").onsubmit = async e => {
    e.preventDefault(); f("t_err").textContent = ""; f("t_ok").textContent = "";
    const amt = r5(f("t_amt").value.replace(/,/g,"")), rate = effRate(), fee = +f("t_fee").value, rateTxt = f("t_rate").value.trim();
    const from = f("t_from").value, to = f("t_ben").value, benName = to ? accName(to) : "", place = f("t_place").value, ben = [benName, place].filter(Boolean).join("، "), cur = f("t_cur").value, tocur = f("t_tocur").value;
    const errs = [];
    if (!from) errs.push("اختر الوسيط");
    if (!to) errs.push("اختر المستفيد");
    if (to && to === from) errs.push("المستفيد يجب أن يختلف عن الوسيط");
    if (!(amt > 0)) errs.push("المبلغ يجب أن يكون أكبر من الصفر");
    if (!(rate > 0)) errs.push("سعر الصرف يجب أن يكون أكبر من الصفر");
    if (!(fee >= 0 && fee < 100)) errs.push("نسبة العمولة بين 0 و 100");
    if (!f("t_date").value) errs.push("اختر التاريخ");
    if (errs.length) { f("t_err").textContent = errs.join(" · "); return; }
    const c = compute(amt, fee, rate), note = withReason("t");
    // Owner's rule (2026-11-27): the agent who collected the money owes it (عليه) less his commission; the beneficiary
    // account is owed the payout (له), so each beneficiary's balance shows the total of transfers due to him.
    const payout = `${fmt(c.sendAmt)} ${cur}` + (cur!==tocur ? ` على سعر ${rateTxt} = ${fmt(c.toAmt)} ${tocur}` : "");
    const desc = `حوالة ${fmt(c.fromTotal)} ${cur} قبضها لصالح ${ben}، يُسلَّم ${payout}`;
    const entries = [{acc:from, cur, debit:c.fromTotal, credit:0, kind:"حوالة", desc: desc + (note?" · "+note:""), recon:""}];
    if (c.fee > 0) entries.push({acc:from, cur, debit:0, credit:c.fee, kind:"عمولة", fee:true, desc:`عمولة الوسيط ${fee}% على حوالة ${ben}`, recon:""});
    entries.push({acc:to, cur:tocur, debit:0, credit:c.toAmt, kind:"حوالة", desc:`حوالة واردة عن طريق ${accName(from)}: ${fmt(c.toAmt)} ${tocur}` + (place?` · مكان التسليم: ${place}`:"") + (note?" · "+note:""), recon:""});
    stampUsd(entries, cur === tocur ? {[cur]:usdRateOf(cur)} : pairUsdRates(cur, tocur, rate));
    const op = {reason:$("#t_reason").value, type:"transfer", date:f("t_date").value, createdAt:Date.now(), status:"active", note, country:f("t_country").value,
      amount:amt, cur, tocur, rate, rateTxt, feePct:fee, feeAmt:c.fee, feeMode:settings.feeMode, from, to, beneficiary:ben, benName, place, payout:c.sendAmt, payoutTo:c.toAmt, delivered:false, entries};
    const btn = f("tf").querySelector("button[type=submit]"); btn.disabled = true;
    try { await saveOp(op); f("t_ok").textContent = `حُفظت الحوالة #${op.no}`; f("t_amt").value = ""; f("t_note").value = ""; f("t_reason").value = ""; f("t_ben").value = ""; f("t_place").value = ""; calc(); }
    catch(err) { f("t_err").textContent = "تعذّر الحفظ: " + (err.message || err.code || "خطأ"); }
    finally { btn.disabled = readOnly; }
  };
};
// fee math. "top": sender pays amount + fee, receiver gets amount*rate. "deduct": sender pays amount, receiver gets (amount-fee)*rate.
function compute(amt, feePct, rate) {
  amt = r5(amt); const fee = r5(amt * feePct / 100);
  if (settings.feeMode === "deduct") { const send = amt - fee; return {fee, sendAmt:send, fromTotal:amt, toAmt:r5(send * rate)}; }
  return {fee, sendAmt:amt, fromTotal:amt + fee, toAmt:r5(amt * rate)};
}

async function updateOp(op, patch) {
  try { await patchOp(op, patch); }
  catch(err) { const el = $("#s_err") || $("#l_err"); if (el) el.textContent = "تعذّر حفظ التعديل: " + (err.message || err.code); }
}
async function downloadCsv(acc, cur, pre, rows, sumD, sumC, fin) {
  const q = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const lines = [["كشف حساب", acc.name + " · " + acc.country, cur].map(q).join(","),
    ["العملية","التاريخ","النوع","البيان","مدين / عليه","دائن / له","الرصيد","الحالة"].map(q).join(","),
    ["","","","رصيد سابق",0,0,fmtBal(pre),""].map(q).join(",")];
  rows.forEach(e => lines.push([e.op.no, e.op.date, e.kind, e.desc, e.debit||0, e.credit||0, fmtBal(e.bal), RECON_LBL[e.recon||""]].map(q).join(",")));
  lines.push(["","","","المجموع",sumD,sumC,fmtBal(fin),""].map(q).join(","));
  lines.push(["","","","الرصيد كتابةً", words(fin) + " " + (CUR_NAMES[cur]||cur) + " " + side(fin)].map(q).join(","));
  const data = "﻿" + lines.join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"text/csv;charset=utf-8"}));
  a.download = `كشف-${acc.name}-${cur}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

let cancelling = null;
function openCancel(op) {

  $("#cancelInfo").textContent = (op.entries[0]?.desc || "") + " · سيُسجَّل قيد عكسي لكل سطر، وتبقى العملية محفوظة في السجل.";

    acc:e.acc, cur:e.cur, ur:e.ur, debit:e.credit||0, credit:e.debit||0, kind:"إلغاء", reversal:true,

  } catch(err) { $("#cancelErr").textContent = "تعذّر الإلغاء: " + (err.message || err.code); }

};

    try { must(await sb.from("settings").upsert({owner:me.id, data:next})); await loadAll(); $("#r_ok").textContent = "تم الحفظ"; }
    catch(err) { $("#r_err").textContent = "تعذّر الحفظ: " + (err.message || err.code); }
  };
};

// ---------- login ----------
const AUTH_MSG = {
  invalid_credentials:"البريد الإلكتروني أو كلمة السر غير صحيحة.",
  email_not_confirmed:"لم يتم تأكيد البريد الإلكتروني بعد. افتح رسالة التأكيد ثم حاول مجدداً.",
  user_already_exists:"هذا البريد مسجّل مسبقاً. استخدم زر «دخول».",
  weak_password:"كلمة السر ضعيفة. استخدم 8 أحرف على الأقل تجمع بين الأحرف والأرقام.",
  over_email_send_rate_limit:"تم تجاوز عدد رسائل البريد المسموح بها مؤقتاً. حاول بعد ساعة.",
  over_request_rate_limit:"محاولات كثيرة خلال وقت قصير. انتظر دقيقة ثم حاول مجدداً.",
  signup_disabled:"إنشاء حسابات جديدة غير مفعّل.",
  email_address_invalid:"البريد الإلكتروني غير صالح.",
  unexpected_failure:"حدث خطأ في خادم تسجيل الدخول. يرجى المحاولة لاحقاً."
};
const authMsg = e => AUTH_MSG[e.code] || ("تعذّر تسجيل الدخول (" + (e.code || e.message || "خطأ غير معروف") + ")");
const authLogo = () => { const t = document.documentElement.dataset.theme || ""; return /^transmind-/.test(t) ? `brand/${t}.svg` : "brand/transmind-logo.svg"; };
function showLogin(msg="") {
  $("#homeBtn").hidden = true; $("#logout").hidden = true; setStatus("");
  document.body.classList.add("auth");
  $("#app").innerHTML = `<div class="auth"><div class="auth-logo"><img src="${authLogo()}" alt="TransMind"></div><form class="auth-panel" id="lf" novalidate>
    <h1>تسجيل الدخول</h1>
    <label>البريد الإلكتروني<input type="email" id="l_email" autocomplete="username" dir="ltr" required></label>
    <label>كلمة السر<input type="password" id="l_pass" autocomplete="current-password" dir="ltr" minlength="8" required></label>
    <div class="err" id="l_msg" role="alert">${esc(msg)}</div>
    <button class="p" type="submit">دخول</button><button type="button" id="l_new">إنشاء حساب جديد</button>
    <p class="hint" style="text-align:center">الإصدار ${APP_VERSION}</p>
  </form></div>`;
  const go = async signup => {
    const email = $("#l_email").value.trim(), password = $("#l_pass").value;
    if (!email || password.length < 8) { $("#l_msg").textContent = "أدخل البريد الإلكتروني وكلمة سر من 8 أحرف على الأقل."; return; }
    $("#l_msg").textContent = "";
    const {data, error} = signup
      ? await sb.auth.signUp({email, password, options:{emailRedirectTo:location.origin + location.pathname}})
      : await sb.auth.signInWithPassword({email, password});
    if (error) { $("#l_msg").textContent = authMsg(error); return; }
    unlocked = true; // just proved the password

    if (signup && !data.session) $("#l_msg").textContent = "تم إنشاء الحساب. افتح رسالة التأكيد في بريدك الإلكتروني، ثم سجّل الدخول.";
  };
  $("#lf").onsubmit = e => { e.preventDefault(); go(false); };
  $("#l_new").onclick = () => go(true);
}
// ---------- biometric lock (WebAuthn platform authenticator) ----------
// ponytail: this is a device-side lock in front of the saved login, not a server login; the server still requires the Supabase session.
// Upgrade path: Supabase passkey/MFA sign-in once available on the project.
const BIO_KEY = "bioCredId", LOCK_AFTER_MS = 5 * 60 * 1000;
let unlocked = false, hiddenAt = 0, lastSession = null;
// After «تنزيل أحدث نسخة الآن»: keep the session unlocked across that one reload (same tab, within 60 s) and say what happened.
let updInfo = null; try { updInfo = JSON.parse(sessionStorage.getItem("updFrom") || "null"); sessionStorage.removeItem("updFrom"); } catch {}
if (updInfo && Date.now() - updInfo.t < 60000) { unlocked = !!updInfo.unlocked;
  addEventListener("load", () => { const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status");
    d.textContent = updInfo.v === APP_VERSION ? `لديك أحدث نسخة بالفعل (الإصدار ${APP_VERSION})` : `تم التحديث من الإصدار ${updInfo.v} إلى الإصدار ${APP_VERSION}`;
    document.body.append(d); setTimeout(() => d.remove(), 6000); }); }
const bioId = () => { try { return localStorage.getItem(BIO_KEY); } catch(e) { return null; } };
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = t => Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")), c => c.charCodeAt(0));
const bioSupported = async () => !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false));
async function bioRegister() {
  const c = await navigator.credentials.create({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)), rp:{name:"TransMind"},
    user:{id:new TextEncoder().encode(me.id), name:me.email || "user", displayName:me.email || "user"},
    pubKeyCredParams:[{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"discouraged"}, timeout:60000}});
  localStorage.setItem(BIO_KEY, b64u(c.rawId));
}
// A prompt can hang (e.g. tapped while the app was still resuming). Each tap cancels the previous request and
// starts a fresh one, and a stuck request is abandoned after 20 s, so the next tap always works.
let bioAbort = null;
const bioVerify = () => {
  bioAbort?.abort();
  const ac = bioAbort = new AbortController(), timer = setTimeout(() => ac.abort(), 20000);
  return navigator.credentials.get({signal:ac.signal, publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)), allowCredentials:[{type:"public-key", id:unb64u(bioId())}],
    userVerification:"required", timeout:20000}}).finally(() => { clearTimeout(timer); if (bioAbort === ac) bioAbort = null; });
};
async function bioSettings() {
  const btn = $("#bio_btn"), err = $("#bio_err");
  if (!(await bioSupported())) { btn.textContent = "هذا الجهاز أو المتصفح لا يدعم البصمة"; return; }
  const draw = () => { btn.disabled = false; btn.className = bioId() ? "d" : "p"; btn.textContent = bioId() ? "إلغاء الدخول بالبصمة" : "تفعيل الدخول بالبصمة / Face ID"; };
  draw();
  btn.onclick = async () => {
    err.textContent = "";
    if (bioId()) { try { localStorage.removeItem(BIO_KEY); } catch(e) {} draw(); return; }
    try { await bioRegister(); draw(); } catch(e) { err.textContent = e.name === "NotAllowedError" ? "أُلغيت العملية أو انتهت مهلتها." : "تعذّر التفعيل: " + (e.message || e.name); }
  };
}
function showLock(msg = "") {
  if ($("#bio_go") && !msg) return; // already showing: redrawing would drop a tap in progress
  loaded = {acc:false, ops:false, set:false}; accounts = []; ops = []; // nothing stays readable behind the lock
  $("#homeBtn").hidden = true; $("#logout").hidden = true; setStatus("");
  document.body.classList.add("auth");
  $("#app").innerHTML = `<div class="auth"><div class="auth-logo"><img src="${authLogo()}" alt="TransMind"></div><div class="auth-panel">
    <h1>التطبيق مقفل</h1>
    <button class="p" type="button" id="bio_go">فتح بالبصمة / Face ID</button>
    <button type="button" id="bio_pw">الدخول بكلمة السر بدلاً من ذلك</button>
    <div class="err" id="bio_msg" role="alert">${esc(msg)}</div>
    <p class="hint" style="text-align:center">الإصدار ${APP_VERSION}</p></div></div>`;
  $("#bio_go").onclick = async () => {
    const btn = $("#bio_go"), m = $("#bio_msg");
    m.textContent = ""; btn.textContent = "جارٍ التحقق…";
    try {
      await bioVerify(); unlocked = true;
      document.body.classList.remove("auth"); $("#app").innerHTML = `<div class="empty">جارِ تحميل البيانات…</div>`;
      // ponytail: waits up to 8 s for the saved session; onAuthStateChange also lands in onSession once ready.
      const ses = lastSession || await Promise.race([sb.auth.getSession().then(r => r.data.session), new Promise(r => setTimeout(() => r(lastSession), 8000))]);
      // No session yet means the server did not answer; say so instead of dropping to the password page.
      if (ses) onSession(ses); else { unlocked = false; showLock("تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم اضغط مرة أخرى."); }
    }
    catch(e) {
      if (!$("#bio_go") || (e.name === "AbortError" && bioAbort)) return; // replaced by a newer tap
      btn.textContent = "فتح بالبصمة / Face ID";
      m.textContent = e.name === "AbortError" ? "انتهت المهلة. اضغط مرة أخرى." : e.name === "NotAllowedError" ? "لم يتم التحقق. اضغط مرة أخرى." : "تعذّر التحقق: " + (e.message || e.name);
    }
  };
  $("#bio_pw").onclick = () => sb.auth.signOut();
}

async function onSession(session) {
  lastSession = session;
  me = session?.user || null;
  if (!me) { loaded = {acc:false, ops:false, set:false}; unlocked = false; showLogin(); return; }
  if (bioId() && !unlocked) { showLock(); return; }
  $("#logout").hidden = false;
  if (!loaded.ops) { document.body.classList.remove("auth"); $("#app").innerHTML = `<div class="empty">جارِ تحميل البيانات…</div>`; }
  try { await loadAll(); }
  catch(e) {
    setStatus("خطأ في الاتصال");
    if (!loaded.ops) $("#app").innerHTML = `<div class="card" style="max-width:420px;margin:40px auto;text-align:center;align-items:center">
      <p>تعذّر تحميل البيانات. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.</p><p class="hint">${esc(e.message || e.code || "")}</p>
      <button class="p" type="button" id="retryLoad">إعادة المحاولة</button></div>`;
    $("#retryLoad")?.addEventListener("click", () => onSession(lastSession));
  }
}

// ---------- boot ----------
(() => {
  if (!window.supabase || !window.SARRAFA_CONFIG?.url) { $("#app").innerHTML = `<div class="banner">تعذّر الاتصال بالخادم. تحقق من الاتصال بالإنترنت وحاول مرة أخرى.</div>`; return; }
  sb = window.supabase.createClient(SARRAFA_CONFIG.url, SARRAFA_CONFIG.key);
  if (bioId()) showLock(); // fingerprint prompt is available at once; the saved session is checked in parallel
  $("#logout").onclick = () => sb.auth.signOut();
  // Home: step back through history to the start instead of piling new entries on top.
  $("#homeBtn").onclick = () => { if (navDepth > 0) { goingHome = true; history.go(-navDepth); } else location.replace("#home"); };
  sb.auth.onAuthStateChange((ev, session) => { if (ev !== "TOKEN_REFRESHED") setTimeout(() => onSession(session)); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (me && bioId() && unlocked && Date.now() - hiddenAt > LOCK_AFTER_MS) { unlocked = false; showLock(); return; }
    if (me && (unlocked || !bioId())) loadAll().catch(() => {});
  });
  if ("serviceWorker" in navigator) {
    const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } }); // pick up a new version at once
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(r => r.update()).catch(() => {});
  }
})();
</script>
